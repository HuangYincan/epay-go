name: Tests and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epay_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: epay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epay_test -d epay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EPAY_TEST_DATABASE_DSN: host=127.0.0.1 port=5432 user=epay_test password=test-only dbname=epay_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector and PostgreSQL
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build backend
        run: go build -o /tmp/epay-server ./cmd/server
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: Dockerfile
          - context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build --build-arg GOPROXY=https://proxy.golang.org,direct --build-arg NPM_REGISTRY=https://registry.npmjs.org -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"
